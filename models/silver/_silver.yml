version: 2

models:
  - name: slv_users
    description: "Cleaned users."
    columns:
      - name: user_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: email
        description: "Lower-cased email"
        data_tests:
          - not_null
      - name: is_active
        description: "Boolean"
        data_tests:
          - not_null
      - name: dept_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('slv_departments')
              field: dept_id
      - name: location_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('slv_locations')
              field: location_id
  - name: slv_groups
    description: "Cleaned assignment groups."
    columns:
      - name: group_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: group_name
        description: "Name"
        data_tests:
          - not_null
  - name: slv_locations
    description: "Cleaned locations."
    columns:
      - name: location_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: country
        description: "ISO country, upper-case"
        data_tests:
          - not_null
  - name: slv_departments
    description: "Cleaned departments."
    columns:
      - name: dept_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: dept_name
        description: "Name"
        data_tests:
          - not_null
  - name: slv_assets
    description: "Cleaned assets."
    columns:
      - name: asset_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: asset_tag
        description: "Tag"
        data_tests:
          - unique
          - not_null
      - name: status
        description: "Status"
        data_tests:
          - not_null
          - accepted_values:
              values: ['in use', 'in stock', 'retired', 'repair']
      - name: cost_eur
        description: "Cost in EUR"
        data_tests:
          - not_null
          - non_negative
      - name: purchase_date
        description: "Purchase date"
        data_tests:
          - not_null
          - not_in_future
      - name: assigned_user_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('slv_users')
              field: user_id
      - name: location_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('slv_locations')
              field: location_id
  - name: slv_cmdb_ci
    description: "Configuration items."
    columns:
      - name: ci_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: ci_class
        description: "Class"
        data_tests:
          - not_null
      - name: environment
        description: "Environment"
        data_tests:
          - not_null
          - accepted_values:
              values: ['prod', 'test', 'dev']
      - name: criticality
        description: "1-4"
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
      - name: owner_group_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('slv_groups')
              field: group_id
  - name: slv_sla_definitions
    description: "SLA targets per priority."
    columns:
      - name: sla_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: priority_level
        description: "Priority"
        data_tests:
          - unique
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
      - name: resolution_hours
        description: "Target"
        data_tests:
          - not_null
          - non_negative
  - name: slv_calendar
    description: "Calendar spine."
    columns:
      - name: date_day
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: year
        description: "Year"
        data_tests:
          - not_null
  - name: slv_incidents
    description: "Deduplicated, typed incidents (incremental, latest version wins)."
    columns:
      - name: incident_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: opened_at
        description: "Opened"
        data_tests:
          - not_null
          - not_in_future
      - name: priority_level
        description: "1-4"
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
      - name: state
        description: "State"
        data_tests:
          - not_null
          - accepted_values:
              values: ['New', 'In Progress', 'On Hold', 'Resolved', 'Closed', 'Cancelled']
      - name: category
        description: "Category"
        data_tests:
          - not_null
          - accepted_values:
              values: ['hardware', 'software', 'network', 'access', 'email', 'database', 'security']
      - name: assignment_group_id
        description: "FK"
        data_tests:
          - not_null
          - relationships:
              to: ref('slv_groups')
              field: group_id
      - name: caller_id
        description: "FK"
        data_tests:
          - not_null
          - relationships:
              to: ref('slv_users')
              field: user_id
      - name: ci_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('slv_cmdb_ci')
              field: ci_id
      - name: reopen_count
        description: "Reopens"
        data_tests:
          - not_null
          - non_negative
  - name: slv_requests
    description: "Deduplicated, typed requests (incremental)."
    columns:
      - name: request_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: opened_at
        description: "Opened"
        data_tests:
          - not_null
      - name: priority_level
        description: "1-4"
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
      - name: state
        description: "State"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Closed', 'Fulfilled', 'In Progress', 'Cancelled']
      - name: cost_eur
        description: "Cost"
        data_tests:
          - not_null
          - non_negative
      - name: assignment_group_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('slv_groups')
              field: group_id
      - name: requested_for_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('slv_users')
              field: user_id
  - name: slv_changes
    description: "Deduplicated, typed changes (incremental)."
    columns:
      - name: change_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: opened_at
        description: "Opened"
        data_tests:
          - not_null
      - name: change_type
        description: "Type"
        data_tests:
          - not_null
          - accepted_values:
              values: ['standard', 'normal', 'emergency']
      - name: risk
        description: "Risk"
        data_tests:
          - not_null
          - accepted_values:
              values: ['low', 'moderate', 'high']
      - name: state
        description: "State"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Implemented', 'Closed', 'Scheduled', 'Cancelled']
      - name: ci_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('slv_cmdb_ci')
              field: ci_id
      - name: assignment_group_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('slv_groups')
              field: group_id
  - name: slv_incident_sla
    description: "Resolution time and SLA breach per incident."
    columns:
      - name: incident_id
        description: "PK"
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('slv_incidents')
              field: incident_id
      - name: sla_target_hours
        description: "Target"
        data_tests:
          - not_null
      - name: resolution_hours
        description: "Hours to resolve"
        data_tests:
          - non_negative
  - name: slv_request_fulfilment
    description: "Fulfilment time per request."
    columns:
      - name: request_id
        description: "PK"
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('slv_requests')
              field: request_id
      - name: is_fulfilled
        description: "Flag"
        data_tests:
          - not_null
      - name: fulfilment_hours
        description: "Hours"
        data_tests:
          - non_negative
  - name: slv_change_outcomes
    description: "Lead time and outcome per change."
    columns:
      - name: change_id
        description: "PK"
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('slv_changes')
              field: change_id
      - name: is_emergency
        description: "Flag"
        data_tests:
          - not_null
      - name: lead_time_hours
        description: "Hours"
        data_tests:
          - non_negative
