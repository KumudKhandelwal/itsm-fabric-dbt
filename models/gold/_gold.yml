version: 2

models:
  - name: dim_date
    description: "Date dimension."
    columns:
      - name: date_day
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: year_month
        description: "YYYY-MM"
        data_tests:
          - not_null
  - name: dim_user
    description: "User dimension with department and location."
    columns:
      - name: user_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: "Name"
        data_tests:
          - not_null
  - name: dim_group
    description: "Assignment group dimension."
    columns:
      - name: group_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: group_name
        description: "Name"
        data_tests:
          - not_null
  - name: dim_location
    description: "Location dimension."
    columns:
      - name: location_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: country
        description: "Country"
        data_tests:
          - not_null
  - name: dim_department
    description: "Department dimension."
    columns:
      - name: dept_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: dept_name
        description: "Name"
        data_tests:
          - not_null
  - name: dim_asset
    description: "Asset dimension."
    columns:
      - name: asset_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: asset_tag
        description: "Tag"
        data_tests:
          - unique
          - not_null
  - name: dim_ci
    description: "Configuration item dimension."
    columns:
      - name: ci_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: ci_name
        description: "Name"
        data_tests:
          - not_null
  - name: dim_priority
    description: "Priority dimension with SLA targets."
    columns:
      - name: priority_level
        description: "PK"
        data_tests:
          - unique
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
      - name: resolution_target_hours
        description: "Target"
        data_tests:
          - not_null
  - name: dim_category
    description: "Incident category dimension."
    columns:
      - name: category_key
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: category
        description: "Category"
        data_tests:
          - unique
          - not_null
  - name: fct_incidents
    description: "Incident fact (incremental)."
    columns:
      - name: incident_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: opened_date
        description: "FK"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: priority_level
        description: "FK"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_priority')
              field: priority_level
      - name: assignment_group_id
        description: "FK"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_group')
              field: group_id
      - name: caller_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('dim_user')
              field: user_id
      - name: ci_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('dim_ci')
              field: ci_id
      - name: category
        description: "FK"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_category')
              field: category
  - name: fct_requests
    description: "Request fact (incremental)."
    columns:
      - name: request_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: opened_date
        description: "FK"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: assignment_group_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('dim_group')
              field: group_id
      - name: requested_for_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('dim_user')
              field: user_id
  - name: fct_changes
    description: "Change fact (incremental)."
    columns:
      - name: change_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: opened_date
        description: "FK"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: ci_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('dim_ci')
              field: ci_id
      - name: assignment_group_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('dim_group')
              field: group_id
  - name: fct_asset_inventory
    description: "Asset inventory fact."
    columns:
      - name: asset_id
        description: "PK"
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: asset_id
      - name: age_days
        description: "Age"
        data_tests:
          - not_null
          - non_negative
      - name: location_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: assigned_user_id
        description: "FK"
        data_tests:
          - relationships:
              to: ref('dim_user')
              field: user_id
  - name: kpi_mttr_daily
    description: "MTTR per day and priority."
    columns:
      - name: date_day
        description: "Day"
        data_tests:
          - not_null
      - name: priority_level
        description: "Priority"
        data_tests:
          - not_null
      - name: mttr_hours
        description: "MTTR"
        data_tests:
          - not_null
          - non_negative
  - name: kpi_sla_compliance_monthly
    description: "SLA compliance per month."
    columns:
      - name: month_start
        description: "Month"
        data_tests:
          - unique
          - not_null
      - name: sla_compliance_rate
        description: "Rate 0-1"
        data_tests:
          - not_null
          - between_zero_and_one
  - name: kpi_incident_backlog_weekly
    description: "Weekly incident intake and open backlog."
    columns:
      - name: week_start
        description: "Week"
        data_tests:
          - unique
          - not_null
      - name: opened_incidents
        description: "Count"
        data_tests:
          - not_null
          - non_negative
  - name: kpi_change_success_monthly
    description: "Change success rate per month."
    columns:
      - name: month_start
        description: "Month"
        data_tests:
          - unique
          - not_null
      - name: change_success_rate
        description: "Rate 0-1"
        data_tests:
          - not_null
          - between_zero_and_one
  - name: kpi_request_fulfilment_monthly
    description: "Request fulfilment per month."
    columns:
      - name: month_start
        description: "Month"
        data_tests:
          - unique
          - not_null
      - name: total_cost_eur
        description: "Cost"
        data_tests:
          - not_null
          - non_negative
  - name: kpi_incidents_by_group
    description: "Incident KPIs per assignment group."
    columns:
      - name: group_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: sla_breach_rate
        description: "Rate 0-1"
        data_tests:
          - between_zero_and_one
  - name: kpi_asset_cost_by_dept
    description: "Asset cost per department."
    columns:
      - name: dept_id
        description: "PK"
        data_tests:
          - unique
          - not_null
      - name: total_cost_eur
        description: "Cost"
        data_tests:
          - not_null
          - non_negative
