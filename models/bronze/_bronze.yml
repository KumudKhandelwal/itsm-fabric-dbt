        description: "Business key as received."
        data_tests:
          - not_null
  - name: brz_changes
    description: "Raw changes as landed, plus load metadata."
    columns:
      - name: change_id
        description: "Business key as received."
        data_tests:
          - not_null
  - name: brz_calendar
    description: "Raw calendar as landed, plus load metadata."
    columns:
      - name: date_day
        description: "Business key as received."
        data_tests:
          - not_null
