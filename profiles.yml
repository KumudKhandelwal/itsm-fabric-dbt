# Safe to commit: no secrets. Credentials come from environment variables.
itsm_lakehouse:
  target: ci
  outputs:
    # Local development and GitHub Actions CI: runs the full DAG on DuckDB.
    ci:
      type: duckdb
      path: target/itsm.duckdb
      threads: 4

    # Microsoft Fabric Lakehouse via Livy (adapter: dbt-fabricspark).
    # Check the current dbt-fabricspark documentation for the latest option names.
    fabric:
      type: fabricspark
      method: livy
      authentication: "{{ env_var('FABRIC_AUTH', 'CLI') }}"   # CLI | SPN
      endpoint: https://api.fabric.microsoft.com/v1
      workspaceid: "{{ env_var('FABRIC_WORKSPACE_ID') }}"
      lakehouseid: "{{ env_var('FABRIC_LAKEHOUSE_ID') }}"
      lakehouse: "{{ env_var('FABRIC_LAKEHOUSE_NAME') }}"
      schema: "{{ env_var('FABRIC_LAKEHOUSE_NAME') }}"
      threads: 4
      connect_retries: 1
      connect_timeout: 30
      retry_all: true
